<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Musawara Go</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/brand.css" />
  <style>
    .go { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; display: grid; gap: 20px; }
    .go h1 { margin: 0; font-size: 28px; letter-spacing: -.015em; }
    .go p { margin: 0; color: var(--muted); }
    .apps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .apps a { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); text-decoration: none; }
    .apps a:hover { border-color: var(--accent); }
    .apps b { display: block; color: var(--accent); }
    .apps span { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="go">
    <header>
      <img class="logo" src="/musawara-logo.png" alt="Musawara" width="96" height="25" />
      <h1>Musawara Go</h1>
      <p>Aplikasi kecil untuk acara dan kerja harian.</p>
    </header>
    <ul class="apps">
      <li><a href="https://musawara.id/nuralive/price-calculator/"><b>Kalkulator harga jual</b><span>Hitung harga jual dan margin setelah biaya marketplace, logistik, dan retur.</span></a></li>
    </ul>
  </main>
</body>
</html>
